<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="55%" stop-color="#130E22" />
      <stop offset="100%" stop-color="#1B0D1D" />
    </linearGradient>
    <linearGradient id="borderPet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.78" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6" />
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="186" rx="12" fill="url(#bgPet)" stroke="url(#borderPet)" stroke-width="1.5" />
  <rect x="2" y="2" width="5" height="186" rx="2.5" fill="#A78BFA" />

  <!-- Left Content Area -->
  <g transform="translate(30, 34)">
    <text x="0" y="6" fill="#C4B5FD" font-size="13" font-weight="700" class="mono">05 // OPEN-SOURCE 3D AI COMPANION &amp; PET FRAMEWORK</text>

    <text x="0" y="38" fill="#F8FAFC" font-size="24" font-weight="800" class="sans">🐾 AetherPet</text>
    <rect x="180" y="19" width="94" height="22" rx="5" fill="#A78BFA" fill-opacity="0.16" stroke="#A78BFA" stroke-opacity="0.45" />
    <text x="227" y="34" text-anchor="middle" fill="#C4B5FD" font-size="11" font-weight="600" class="mono">Three.js + VRM</text>
    <rect x="282" y="19" width="122" height="22" rx="5" fill="#EC4899" fill-opacity="0.14" stroke="#EC4899" stroke-opacity="0.45" />
    <text x="343" y="34" text-anchor="middle" fill="#F472B6" font-size="11" font-weight="600" class="mono">Voice Lip-Sync</text>

    <!-- Description -->
    <text x="0" y="68" fill="#CBD5E1" font-size="13.5" class="sans">
      Interactive 3D AI companion powered by <tspan fill="#C4B5FD" class="mono" font-size="12.5">Multi-LLM</tspan> (DeepSeek / OpenAI / Ollama) &amp; real-time <tspan fill="#F472B6" class="mono" font-size="12.5">Multi-TTS</tspan>.
    </text>
    <text x="0" y="90" fill="#94A3B8" font-size="12.5" class="sans">
      Expressive VRM avatar rigging · Real-time audio-driven lip-sync · Extensible companion persona &amp; desktop runtime
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="96" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <circle cx="14" cy="12" r="4" fill="#3178C6" />
      <text x="24" y="16" fill="#E2E8F0" font-size="11" class="mono">TypeScript</text>

      <rect x="104" y="0" width="84" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <text x="146" y="16" text-anchor="middle" fill="#F8FAFC" font-size="11" class="mono">Next.js</text>

      <rect x="196" y="0" width="96" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <text x="244" y="16" text-anchor="middle" fill="#C4B5FD" font-size="11" class="mono">Three.js</text>

      <rect x="300" y="0" width="88" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <text x="344" y="16" text-anchor="middle" fill="#F472B6" font-size="11" class="mono">VRM / TTS</text>

      <rect x="396" y="0" width="114" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <text x="453" y="16" text-anchor="middle" fill="#38BDF8" font-size="11" class="mono">Ollama / LLM</text>
    </g>
  </g>

  <!-- Right Architecture Blueprint Box -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="360" height="150" rx="8" fill="#060A11" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="20" fill="#64748B" font-size="10.5" font-weight="600" class="mono">REALTIME // MULTIMODAL COMPANION PIPELINE</text>
    <line x1="14" y1="28" x2="346" y2="28" stroke="#1E293B" stroke-width="1" />

    <!-- Box 1 -->
    <rect x="14" y="40" width="154" height="42" rx="6" fill="#0F172A" stroke="#A78BFA" stroke-opacity="0.5" />
    <text x="91" y="58" text-anchor="middle" fill="#C4B5FD" font-size="10.5" font-weight="700" class="mono">Multi-LLM Brain</text>
    <text x="91" y="73" text-anchor="middle" fill="#64748B" font-size="9" class="mono">DeepSeek · OpenAI · Ollama</text>

    <text x="180" y="65" text-anchor="middle" fill="#EC4899" font-size="13" class="mono">→</text>

    <!-- Box 2 -->
    <rect x="192" y="40" width="154" height="42" rx="6" fill="#0F172A" stroke="#EC4899" stroke-opacity="0.5" />
    <text x="269" y="58" text-anchor="middle" fill="#F472B6" font-size="10.5" font-weight="700" class="mono">Multi-TTS Engine</text>
    <text x="269" y="73" text-anchor="middle" fill="#64748B" font-size="9" class="mono">Speech + Phoneme Sync</text>

    <!-- Bottom Shell -->
    <rect x="14" y="96" width="332" height="40" rx="6" fill="#A78BFA" fill-opacity="0.08" stroke="#A78BFA" stroke-opacity="0.4" />
    <text x="180" y="114" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600" class="mono">✨ 3D VRM Avatar Renderer (Three.js WebGL)</text>
    <text x="180" y="128" text-anchor="middle" fill="#94A3B8" font-size="9.5" class="mono">Expressions · Real-Time Lip-Sync · Desktop Companion</text>
  </g>
</svg>
