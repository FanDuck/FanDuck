<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="100%" height="100%">
  <defs>
    <linearGradient id="bgQuack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="55%" stop-color="#0A141E" />
      <stop offset="100%" stop-color="#071819" />
    </linearGradient>
    <linearGradient id="borderQuack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.78" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.65" />
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="186" rx="12" fill="url(#bgQuack)" stroke="url(#borderQuack)" stroke-width="1.5" />
  <rect x="2" y="2" width="5" height="186" rx="2.5" fill="#10B981" />

  <!-- Left Content Area -->
  <g transform="translate(30, 34)">
    <text x="0" y="6" fill="#34D399" font-size="13" font-weight="700" class="mono">04 // LOCAL-FIRST DUAL-ENGINE PROXY CONSOLE</text>

    <text x="0" y="38" fill="#F8FAFC" font-size="24" font-weight="800" class="sans">🦆 QuackUI</text>
    <rect x="160" y="19" width="76" height="22" rx="5" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-opacity="0.45" />
    <text x="198" y="34" text-anchor="middle" fill="#FBBF24" font-size="11" font-weight="600" class="mono">v2.3.5</text>
    <rect x="244" y="19" width="142" height="22" rx="5" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.45" />
    <text x="315" y="34" text-anchor="middle" fill="#34D399" font-size="11" font-weight="600" class="mono">Zero Python Deps</text>

    <!-- Description -->
    <text x="0" y="68" fill="#CBD5E1" font-size="13.5" class="sans">
      Binds strictly to <tspan fill="#38BDF8" class="mono" font-size="12.5">127.0.0.1</tspan> (SSH tunnel) · Unified <tspan fill="#34D399" class="mono" font-size="12.5">Xray + sing-box</tspan> dual-engine console.
    </text>
    <text x="0" y="90" fill="#94A3B8" font-size="12.5" class="sans">
      XHTTP+Reality / AnyTLS / Hy2 Port-Hopping · SSE Live GFW Probe · Residential SOCKS5 Routing · Atomic nftables
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="94" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <circle cx="14" cy="12" r="4" fill="#38BDF8" />
      <text x="24" y="16" fill="#E2E8F0" font-size="11" class="mono">Python 3</text>

      <rect x="102" y="0" width="96" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <text x="150" y="16" text-anchor="middle" fill="#FBBF24" font-size="11" class="mono">Xray-core</text>

      <rect x="206" y="0" width="88" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <text x="250" y="16" text-anchor="middle" fill="#34D399" font-size="11" class="mono">sing-box</text>

      <rect x="302" y="0" width="92" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <text x="348" y="16" text-anchor="middle" fill="#38BDF8" font-size="11" class="mono">nftables</text>

      <rect x="402" y="0" width="84" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <text x="444" y="16" text-anchor="middle" fill="#94A3B8" font-size="11" class="mono">SQLite3</text>
    </g>
  </g>

  <!-- Right Architecture Blueprint Box -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="360" height="150" rx="8" fill="#060A11" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="20" fill="#64748B" font-size="10.5" font-weight="600" class="mono">DUAL-ENGINE // LOCAL-FIRST TOPOLOGY</text>
    <line x1="14" y1="28" x2="346" y2="28" stroke="#1E293B" stroke-width="1" />

    <!-- Box 1 -->
    <rect x="14" y="40" width="154" height="42" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.5" />
    <text x="91" y="58" text-anchor="middle" fill="#38BDF8" font-size="10.5" font-weight="700" class="mono">Xray + sing-box</text>
    <text x="91" y="73" text-anchor="middle" fill="#64748B" font-size="9" class="mono">Reality · AnyTLS · Hy2</text>

    <text x="180" y="65" text-anchor="middle" fill="#34D399" font-size="13" class="mono">⇄</text>

    <!-- Box 2 -->
    <rect x="192" y="40" width="154" height="42" rx="6" fill="#0F172A" stroke="#10B981" stroke-opacity="0.5" />
    <text x="269" y="58" text-anchor="middle" fill="#34D399" font-size="10.5" font-weight="700" class="mono">Firewall &amp; Probe</text>
    <text x="269" y="73" text-anchor="middle" fill="#64748B" font-size="9" class="mono">nftables · SSE GFW</text>

    <!-- Bottom Shell -->
    <rect x="14" y="96" width="332" height="40" rx="6" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.4" />
    <text x="180" y="114" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600" class="mono">🔒 SSH Tunnel Only (127.0.0.1:8088) · Zero Bloat</text>
    <text x="180" y="128" text-anchor="middle" fill="#94A3B8" font-size="9.5" class="mono">Multi-Client · Auto Quota · Residential SOCKS5 Exit</text>
  </g>
</svg>
