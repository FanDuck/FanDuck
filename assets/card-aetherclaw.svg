<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAether" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="60%" stop-color="#0B1322" />
      <stop offset="100%" stop-color="#081818" />
    </linearGradient>
    <linearGradient id="borderAether" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6" />
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="186" rx="12" fill="url(#bgAether)" stroke="url(#borderAether)" stroke-width="1.5" />
  <rect x="2" y="2" width="5" height="186" rx="2.5" fill="#10B981" />

  <!-- Left Content Area -->
  <g transform="translate(30, 34)">
    <!-- Top Row: Icon + Repo Name + Badges -->
    <text x="0" y="6" fill="#10B981" font-size="13" font-weight="700" class="mono">01 // AUTONOMOUS AI AGENT FRAMEWORK</text>
    
    <text x="0" y="38" fill="#F8FAFC" font-size="24" font-weight="800" class="sans">🦅 AetherClaw (灵爪)</text>
    <rect x="255" y="19" width="76" height="22" rx="5" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.45" />
    <text x="293" y="34" text-anchor="middle" fill="#34D399" font-size="11" font-weight="600" class="mono">v1.3.0</text>
    <rect x="340" y="19" width="128" height="22" rx="5" fill="#0EA5E9" fill-opacity="0.14" stroke="#0EA5E9" stroke-opacity="0.45" />
    <text x="404" y="34" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="600" class="mono">Win &amp; Linux Native</text>

    <!-- Description -->
    <text x="0" y="68" fill="#CBD5E1" font-size="13.5" class="sans">
      Unifies <tspan fill="#34D399" font-weight="600">OpenClaw</tspan> host OS actuation with <tspan fill="#38BDF8" font-weight="600">Hermes</tspan> 3-tier memory &amp; procedural <tspan fill="#FBBF24" class="mono" font-size="12.5">SKILL.md</tspan> self-evolution.
    </text>
    <text x="0" y="90" fill="#94A3B8" font-size="12.5" class="sans">
      Zero heavy dependencies · UTF-8 PowerShell &amp; Bash PlatformAdapter · Visual Web Console + Interactive CLI
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="82" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <circle cx="14" cy="12" r="4" fill="#F7DF1E" />
      <text x="24" y="16" fill="#E2E8F0" font-size="11" class="mono">Node.js</text>

      <rect x="90" y="0" width="110" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <text x="145" y="16" text-anchor="middle" fill="#94A3B8" font-size="11" class="mono">Multi-LLM API</text>

      <rect x="208" y="0" width="118" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <text x="267" y="16" text-anchor="middle" fill="#94A3B8" font-size="11" class="mono">SKILL.md Engine</text>

      <rect x="334" y="0" width="128" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <text x="398" y="16" text-anchor="middle" fill="#94A3B8" font-size="11" class="mono">PowerShell / Bash</text>

      <rect x="470" y="0" width="84" height="24" rx="5" fill="#0F172A" stroke="#1E293B" />
      <text x="512" y="16" text-anchor="middle" fill="#34D399" font-size="11" class="mono">Zero-Bloat</text>
    </g>
  </g>

  <!-- Right Architecture Blueprint Box -->
  <g transform="translate(615, 20)">
    <rect x="0" y="0" width="360" height="150" rx="8" fill="#060A11" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="20" fill="#64748B" font-size="10.5" font-weight="600" class="mono">ARCHITECTURE // SELF-EVOLVING LOOP</text>
    <line x1="14" y1="28" x2="346" y2="28" stroke="#1E293B" stroke-width="1" />

    <!-- Node 1 -->
    <rect x="14" y="40" width="145" height="42" rx="6" fill="#0F172A" stroke="#10B981" stroke-opacity="0.5" />
    <text x="86" y="58" text-anchor="middle" fill="#34D399" font-size="11" font-weight="700" class="mono">PlatformAdapter</text>
    <text x="86" y="73" text-anchor="middle" fill="#64748B" font-size="9.5" class="mono">Win PS / Linux Bash</text>

    <!-- Arrow -->
    <text x="176" y="65" text-anchor="middle" fill="#38BDF8" font-size="14" class="mono">⇄</text>

    <!-- Node 2 -->
    <rect x="195" y="40" width="150" height="42" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-opacity="0.5" />
    <text x="270" y="58" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="700" class="mono">3-Tier Memory</text>
    <text x="270" y="73" text-anchor="middle" fill="#64748B" font-size="9.5" class="mono">Episodic · Semantic</text>

    <!-- Bottom Node: Skill Synthesis -->
    <rect x="14" y="96" width="331" height="40" rx="6" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.4" />
    <text x="180" y="114" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600" class="mono">⚡ Procedural Skill Distillation (SKILL.md)</text>
    <text x="180" y="128" text-anchor="middle" fill="#94A3B8" font-size="9.5" class="mono">Web Console + REST API + CLI Guardrails</text>
  </g>
</svg>
