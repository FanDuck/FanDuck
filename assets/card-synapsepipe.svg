    <text x="64" y="58" text-anchor="middle" fill="#22D3EE" font-size="10.5" font-weight="700" class="mono">Prompt Schema</text>
    <text x="64" y="73" text-anchor="middle" fill="#64748B" font-size="9" class="mono">Style · [Vars]</text>

    <text x="124" y="65" text-anchor="middle" fill="#64748B" font-size="12" class="mono">→</text>

