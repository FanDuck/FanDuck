  <rect x="2" y="2" width="996" height="186" rx="12" fill="url(#bgSynapse)" stroke="url(#borderSynapse)" stroke-width="1.5" />
  <rect x="2" y="2" width="5" height="186" rx="2.5" fill="#06B6D4" />

  <!-- Left Content Area -->
