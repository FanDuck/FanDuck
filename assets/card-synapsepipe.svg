    <rect x="134" y="40" width="96" height="42" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-opacity="0.5" />
    <text x="182" y="58" text-anchor="middle" fill="#A78BFA" font-size="10.5" font-weight="700" class="mono">AI Studio</text>
    <text x="182" y="73" text-anchor="middle" fill="#64748B" font-size="9" class="mono">Seed · Params</text>

    <text x="240" y="65" text-anchor="middle" fill="#64748B" font-size="12" class="mono">→</text>

